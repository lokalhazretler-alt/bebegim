<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sulamayı unutma</title>
<style>
  :root{
    --bg:#0d0b14;
    --card:#161222;
    --text:#e8e3f0;
    --muted:#8d85a3;
    --accent:#b48ee8;
    --rose:#e85d8a;
  }
  *{box-sizing:border-box}
  html, body{
    height:100%;
  }
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(ellipse at top, #1c1630, #07050c 70%);
    font-family: Georgia, 'Times New Roman', serif;
    color:var(--text);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 20px;
    overflow-y:auto;
  }
  .stars{
    position:fixed;
    inset:0;
    pointer-events:none;
  }
  .star{
    position:absolute;
    width:2px;height:2px;
    background:white;
    border-radius:50%;
    opacity:0.4;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0.15}
    50%{opacity:0.7}
  }
  .card{
    max-width:480px;
    width:100%;
    margin-top:30px;
    margin-bottom:30px;
    max-height:none;
    background:rgba(22,18,34,0.85);
    backdrop-filter: blur(6px);
    border:1px solid rgba(180,142,232,0.15);
    border-radius:20px;
    padding:48px 36px;
    box-shadow:0 20px 70px rgba(0,0,0,0.6);
    text-align:center;
    position:relative;
    z-index:2;
  }
  .card::-webkit-scrollbar{ width:6px; }
  .card::-webkit-scrollbar-thumb{ background:rgba(180,142,232,0.3); border-radius:4px; }
  h1{
    font-size:1.4rem;
    font-weight:normal;
    letter-spacing:1px;
    color:var(--accent);
    margin:0 0 6px;
  }
  .sub{
    color:var(--muted);
    font-size:0.85rem;
    margin-bottom:36px;
    letter-spacing:0.5px;
    font-style:italic;
  }
  .garden{
    height:180px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    margin-bottom:28px;
    position:relative;
  }
  .stem{
    width:4px;
    height:0px;
    background:linear-gradient(to top, #3a5a3a, #4f7a4f);
    transition:height 2.5s ease;
    position:relative;
  }
  .bud{
    position:absolute;
    bottom:100%;
    left:50%;
    width:72px;
    transform:translate(-50%, 50%) scale(0.2);
    opacity:0;
    transform-origin:center center;
    transition:transform 2.2s cubic-bezier(.2,.8,.3,1), opacity 1.8s ease;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,0.5));
  }
  .bud svg{
    display:block;
    width:100%;
    height:auto;
  }
  .leaf{
    position:absolute;
    width:24px;height:13px;
    background:linear-gradient(135deg,#4a7a4a,#6ba06b);
    border-radius:0 100% 0 100%;
    opacity:0;
    transition:opacity 1.3s ease 1.1s, transform 1.3s ease 1.1s;
    box-shadow:inset 0 0 4px rgba(0,0,0,0.25);
  }
  .leaf.left{ left:-16px; bottom:35%; transform:rotate(-25deg) scale(0.3); transform-origin:right center;}
  .leaf.right{ right:-16px; bottom:50%; transform:rotate(25deg) scaleX(-1) scale(0.3); transform-origin:left center;}
  .leaf.grown{ opacity:1; }
  .leaf.left.grown{ transform:rotate(-25deg) scale(1); }
  .leaf.right.grown{ transform:rotate(25deg) scaleX(-1) scale(1); }
  .drop{
    position:absolute;
    width:5px;height:7px;
    background:linear-gradient(180deg, rgba(160,210,235,0.9), rgba(100,170,210,0.95));
    border-radius:50% 50% 50% 0;
    transform:rotate(45deg);
    left:50%;
    top:-20px;
    opacity:0;
    box-shadow:0 0 4px rgba(160,210,235,0.4);
  }
  @keyframes fall{
    0%{top:-20px; opacity:0; transform:rotate(45deg) translateX(-50%) scale(0.6)}
    15%{opacity:0.95; transform:rotate(45deg) translateX(-50%) scale(1)}
    85%{opacity:0.9}
    100%{top:145px; opacity:0; transform:rotate(45deg) translateX(-50%) scale(0.8)}
  }
  .splash{
    position:absolute;
    left:50%;
    top:145px;
    width:4px;height:4px;
    border:1px solid rgba(160,210,235,0.6);
    border-radius:50%;
    transform:translateX(-50%);
    opacity:0;
    pointer-events:none;
  }
  @keyframes ripple{
    0%{width:4px;height:4px;opacity:0.7;transform:translateX(-50%) translateY(0)}
    100%{width:28px;height:10px;opacity:0;transform:translateX(-50%) translateY(2px)}
  }
  .soil-glow{
    position:absolute;
    left:50%;
    bottom:0;
    width:40px;height:6px;
    background:radial-gradient(ellipse, rgba(100,170,210,0.5), transparent 70%);
    transform:translateX(-50%);
    opacity:0;
    transition:opacity 0.6s ease;
    border-radius:50%;
  }
  .hint{
    color:var(--muted);
    font-size:0.85rem;
    margin-top:6px;
    letter-spacing:0.5px;
    font-style:italic;
    transition:opacity 0.8s ease;
  }
  .below{
    display:none;
    margin-top:30px;
    font-size:1.05rem;
    line-height:1.9;
    letter-spacing:0.3px;
    color:var(--text);
    font-style:italic;
    opacity:0;
    transition:opacity 2.5s ease;
  }
  .below.show{
    display:block;
  }
  .below .signature{
    display:block;
    margin-top:14px;
    font-size:0.85rem;
    color:var(--muted);
    letter-spacing:1px;
  }
  button{
    margin-top:28px;
    background:transparent;
    color:var(--accent);
    border:1px solid var(--accent);
    padding:12px 30px;
    border-radius:30px;
    font-size:0.95rem;
    font-family:inherit;
    letter-spacing:1px;
    cursor:pointer;
    transition:all 0.3s ease;
  }
  button:hover{
    background:rgba(180,142,232,0.12);
    box-shadow:0 0 20px rgba(180,142,232,0.3);
  }
  button:disabled{
    opacity:0.3;
    cursor:default;
  }
  #afterText{
    display:none;
    margin-top:24px;
    font-size:1rem;
    color:var(--rose);
    line-height:1.8;
    animation:fadeIn 1.5s ease;
  }
  @keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="card">
  <h1>bir şey sana gelmek istiyor</h1>
  <div class="sub">ama önce toprağa biraz su gerekiyor</div>

  <div class="garden">
    <div class="stem" id="stem">
      <div class="leaf left" id="leafLeft"></div>
      <div class="leaf right" id="leafRight"></div>
      <div class="bud" id="bud">
        <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="70%" stop-color="#f3f0ea"/>
              <stop offset="100%" stop-color="#d8d4cb"/>
            </linearGradient>
            <radialGradient id="centerGrad" cx="42%" cy="35%" r="70%">
              <stop offset="0%" stop-color="#ffe489"/>
              <stop offset="55%" stop-color="#f3b73d"/>
              <stop offset="100%" stop-color="#c98a1a"/>
            </radialGradient>
          </defs>

          <!-- back layer: 16 long thin petals, full circle -->
          <g fill="url(#petalGrad)" stroke="#c9c5bb" stroke-width="0.4">
            <path d="M80,80 C77,70 77,40 80,16 C83,40 83,70 80,80 Z" transform="rotate(0 80 80)"/>
            <path d="M80,80 C77,70 77,40 80,16 C83,40 83,70 80,80 Z" transform="rotate(22.5 80 80)"/>
            <path d="M80,80 C77,70 77,40 80,16 C83,40 83,70 80,80 Z" transform="rotate(45 80 80)"/>
            <path d="M80,80 C77,70 77,40 80,16 C83,40 83,70 80,80 Z" transform="rotate(67.5 80 80)"/>
            <path d="M80,80 C77,70 77,40 80,16 C83,40 83,70 80,80 Z" transform="rotate(90 80 80)"/>
            <path d="M80,80 C77,70 77,40 80,16 C83,40 83,70 80,80 Z" transform="rotate(112.5 80 80)"/>
            <path d="M80,80 C77,70 77,40 80,16 C83,40 83,70 80,80 Z" transform="rotate(135 80 80)"/>
            <path d="M80,80 C77,70 77,40 80,16 C83,40 83,70 80,80 Z" transform="rotate(157.5 80 80)"/>
            <path d="M80,80 C77,70 77,40 80,16 C83,40 83,70 80,80 Z" transform="rotate(180 80 80)"/>
            <path d="M80,80 C77,70 77,40 80,16 C83,40 83,70 80,80 Z" transform="rotate(202.5 80 80)"/>
            <path d="M80,80 C77,70 77,40 80,16 C83,40 83,70 80,80 Z" transform="rotate(225 80 80)"/>
            <path d="M80,80 C77,70 77,40 80,16 C83,40 83,70 80,80 Z" transform="rotate(247.5 80 80)"/>
            <path d="M80,80 C77,70 77,40 80,16 C83,40 83,70 80,80 Z" transform="rotate(270 80 80)"/>
            <path d="M80,80 C77,70 77,40 80,16 C83,40 83,70 80,80 Z" transform="rotate(292.5 80 80)"/>
            <path d="M80,80 C77,70 77,40 80,16 C83,40 83,70 80,80 Z" transform="rotate(315 80 80)"/>
            <path d="M80,80 C77,70 77,40 80,16 C83,40 83,70 80,80 Z" transform="rotate(337.5 80 80)"/>
          </g>

          <!-- front layer: 10 slightly shorter petals, offset, for depth -->
          <g fill="url(#petalGrad)" stroke="#d2cec4" stroke-width="0.3" opacity="0.95">
            <path d="M80,80 C78,72 78,52 80,30 C82,52 82,72 80,80 Z" transform="rotate(10 80 80)"/>
            <path d="M80,80 C78,72 78,52 80,30 C82,52 82,72 80,80 Z" transform="rotate(46 80 80)"/>
            <path d="M80,80 C78,72 78,52 80,30 C82,52 82,72 80,80 Z" transform="rotate(82 80 80)"/>
            <path d="M80,80 C78,72 78,52 80,30 C82,52 82,72 80,80 Z" transform="rotate(118 80 80)"/>
            <path d="M80,80 C78,72 78,52 80,30 C82,52 82,72 80,80 Z" transform="rotate(154 80 80)"/>
            <path d="M80,80 C78,72 78,52 80,30 C82,52 82,72 80,80 Z" transform="rotate(190 80 80)"/>
            <path d="M80,80 C78,72 78,52 80,30 C82,52 82,72 80,80 Z" transform="rotate(226 80 80)"/>
            <path d="M80,80 C78,72 78,52 80,30 C82,52 82,72 80,80 Z" transform="rotate(262 80 80)"/>
            <path d="M80,80 C78,72 78,52 80,30 C82,52 82,72 80,80 Z" transform="rotate(298 80 80)"/>
            <path d="M80,80 C78,72 78,52 80,30 C82,52 82,72 80,80 Z" transform="rotate(334 80 80)"/>
          </g>

          <!-- center disc with gritty texture -->
          <circle cx="80" cy="80" r="15" fill="url(#centerGrad)"/>
          <g fill="#9c6513" opacity="0.5">
            <circle cx="74" cy="75" r="1"/>
            <circle cx="82" cy="73" r="1"/>
            <circle cx="88" cy="78" r="1"/>
            <circle cx="90" cy="86" r="1"/>
            <circle cx="84" cy="90" r="1"/>
            <circle cx="76" cy="89" r="1"/>
            <circle cx="70" cy="83" r="1"/>
            <circle cx="80" cy="80" r="1"/>
            <circle cx="77" cy="82" r="0.8"/>
            <circle cx="86" cy="82" r="0.8"/>
          </g>
        </svg>
      </div>
      <div class="drop" id="drop1"></div>
      <div class="drop" id="drop2"></div>
      <div class="drop" id="drop3"></div>
      <div class="drop" id="drop4"></div>
      <div class="splash" id="splash1"></div>
      <div class="splash" id="splash2"></div>
      <div class="splash" id="splash3"></div>
      <div class="splash" id="splash4"></div>
      <div class="soil-glow" id="soilGlow"></div>
    </div>
  </div>

  <div class="hint" id="hintText">dokun — ne olacağını birlikte görelim</div>

  <button id="waterBtn" onclick="water()">suyu dök</button>

  <div class="below" id="belowText">...</div>
</div>

<script>
  // stars background
  const starsEl = document.getElementById('stars');
  for(let i=0;i<60;i++){
    const s = document.createElement('div');
    s.className='star';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*3)+'s';
    starsEl.appendChild(s);
  }

  let watered = false;
  function water(){
    if(watered) return;
    watered = true;
    document.getElementById('waterBtn').disabled = true;
    document.getElementById('hintText').style.opacity = '0';

    // realistic staggered drops with slight horizontal drift and varied timing
    const drops = [
      {el:document.getElementById('drop1'), left:44, delay:0,   dur:1.1},
      {el:document.getElementById('drop2'), left:52, delay:180, dur:1.0},
      {el:document.getElementById('drop3'), left:38, delay:340, dur:1.15},
      {el:document.getElementById('drop4'), left:58, delay:520, dur:1.05}
    ];
    const splashes = [
      document.getElementById('splash1'),
      document.getElementById('splash2'),
      document.getElementById('splash3'),
      document.getElementById('splash4')
    ];

    drops.forEach((d,i)=>{
      d.el.style.left = d.left + '%';
      d.el.style.animation = `fall ${d.dur}s cubic-bezier(.4,0,.8,1) forwards`;
      d.el.style.animationDelay = d.delay+'ms';

      setTimeout(()=>{
        const s = splashes[i];
        s.style.left = d.left + '%';
        s.style.opacity = '0.7';
        s.style.animation = 'ripple 0.5s ease-out forwards';
      }, d.delay + d.dur*1000*0.95);
    });

    setTimeout(()=>{
      document.getElementById('soilGlow').style.opacity = '1';
    }, 900);

    // stem grows
    setTimeout(()=>{
      document.getElementById('stem').style.height = '120px';
    }, 1000);

    // leaves unfold
    setTimeout(()=>{
      document.getElementById('leafLeft').classList.add('grown');
      document.getElementById('leafRight').classList.add('grown');
    }, 1600);

    // bud appears and blooms
    setTimeout(()=>{
      const bud = document.getElementById('bud');
      bud.style.opacity = '1';
      bud.style.transform = 'translate(-50%, 50%) scale(1)';
    }, 2200);

    // once fully bloomed, the apology settles below
    setTimeout(()=>{
      const b = document.getElementById('belowText');
      b.innerHTML =
        'biliyorum, az önce aramızda olmaması gereken bir şey oldu. ' +
        'söylediklerim ya da susmalarım seni yordu — ve bunun farkındayım.<br><br>' +
        'haklı olduğun yerde gerçekten haklıydın. seni kırdıysam, umursamadığımı hissettirdiysem, ' +
        'ya da yanında olmam gereken bir anda uzak durduysam — bunun hiçbir bahanesi yok. ' +
        'sadece özür dilerim diyorum, en içten haliyle.<br><br>' +
        'küs kalmak kolay geliyor olabilir ama bana hiç kolay gelmiyor. seninle konuşmadığım her gün, ' +
        'söylenmemiş bir şeyin ağırlığını taşıyormuşum gibi hissettiriyor.<br><br>' +
        'bu çiçek büyük bir söz değil. sadece şunu bilmeni istedim: seni önemsiyorum, ' +
        've bunu göstermekte eksik kaldıysam, bunu düzeltmek isterim. hazır olduğunda, ' +
        'konuşmak istiyorum — kaçmadan, savunmadan, sadece gerçekten.' +
        '<span class="signature">— seni seven biri</span>';
      b.classList.add('show');
      requestAnimationFrame(()=> b.style.opacity = '1');
    }, 4600);
  }
</script>
</body>
</html>
